<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>VanRoute RMUTT</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--b:#1d4ed8;--s:#38bdf8;--bg:#f3f4f6;--c:#fff;--t:#111827;--m:#6b7280;--ok:#16a34a;--w:#d97706;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f172a;--c:#1e293b;--t:#f1f5f9;--m:#94a3b8;--bd:#334155}}
:root[data-theme=dark]{--bg:#0f172a;--c:#1e293b;--t:#f1f5f9;--m:#94a3b8;--bd:#334155}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 "Noto Sans Thai",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:72px}
.p{padding:16px}.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--b);color:#fff;font:600 16px inherit;font-family:inherit;margin:8px 0;cursor:pointer}
.btn.o{background:var(--c);color:var(--b);border:1.5px solid var(--b)}
.hero{background:linear-gradient(160deg,var(--b),var(--s));color:#fff;text-align:center;padding:64px 24px;border-radius:0 0 28px 28px}
.logo{font-size:56px}.m{color:var(--m);font-size:14px}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.sel{width:100%;min-height:48px;border:1px solid var(--bd);border-radius:12px;padding:0 10px;background:var(--c);color:var(--t);font:inherit}
.sw{display:block;margin:6px auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--c);font-size:20px;cursor:pointer;color:var(--t)}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:12px}.sc div{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:10px 2px;cursor:pointer}.sc b{display:block;font-size:22px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:flex;background:var(--c);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:8px 0;min-height:56px;font:12px inherit;font-family:inherit;cursor:pointer}nav button.a{color:var(--b);font-weight:700}nav span{display:block;font-size:20px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#fef3c7;color:#92400e}
.ok{background:#dcfce7;color:#166534}svg{width:100%;height:auto;border-radius:14px;background:#e0f2fe;display:block}
h2{margin:0 0 10px}.back{background:none;border:0;color:var(--b);font:600 15px inherit;font-family:inherit;padding:8px 0;cursor:pointer}
</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script></head><body><div id="app"></div><nav id="nav" hidden></nav>
<script>
const NA="รอข้อมูลยืนยัน";
const PL={rmutt:{n:"มทร.ธัญบุรี (RMUTT)",la:14.0369,lo:100.7285,t:"ต้นทาง/ปลายทาง"},fp:{n:"ฟิวเจอร์พาร์ค รังสิต",la:13.9886,lo:100.6169,t:"ต้นทาง/ปลายทาง"},
pu:{n:"จุดขึ้นรถ มทร.ธัญบุรี (Demo)",la:14.0360,lo:100.7275,t:"จุดขึ้นรถ"},dr:{n:"จุดลงรถ ฟิวเจอร์พาร์ค (Demo)",la:13.9890,lo:100.6175,t:"จุดลงรถ"}};
const S={scr:"splash",user:null,o:"rmutt",d:"fp",fav:[],me:null,msg:"",date:"วันนี้",sel:null};
try{S.fav=JSON.parse(localStorage.getItem("vr_fav")||"[]")}catch(e){}
const $=id=>document.getElementById(id),A=$("app");
const go=s=>{S.scr=s;render()};
const key=()=>S.o+">"+S.d,lab=()=>PL[S.o].n+" → "+PL[S.d].n;
function hav(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function opts(v){return Object.keys(PL).filter(k=>k=="rmutt"||k=="fp").map(k=>`<option value="${k}" ${k==v?"selected":""}>${PL[k].n}</option>`).join("")}
function xy(p){return[20+(p.lo-100.60)/0.14*260,30+(14.05-p.la)/0.08*240]}
function map(){return '<div id="lmap" style="height:380px;border-radius:14px;z-index:0"></div>'}
let LM=null;const RC={};
function dist(){const r=RC[S.o+S.d];return r?"≈ "+r.km.toFixed(1)+" กม.":"กำลังคำนวณ..."}
function tm(){const r=RC[S.o+S.d];return r?"≈ "+Math.round(r.min)+" นาที (ไม่รวมรถติด/จุดจอด)":"กำลังคำนวณ..."}
function loadRoute(cb){const a=PL[S.o=="rmutt"?"pu":"dr"],b=PL[S.o=="rmutt"?"dr":"pu"],k=S.o+S.d;
if(RC[k])return cb&&cb(RC[k]);
fetch("https://router.project-osrm.org/route/v1/driving/"+a.lo+","+a.la+";"+b.lo+","+b.la+"?overview=full&geometries=geojson").then(r=>r.json()).then(j=>{const r=j.routes[0];RC[k]={km:r.distance/1000,min:r.duration/60,pts:r.geometry.coordinates.map(c=>[c[1],c[0]])};cb&&cb(RC[k]);if(S.scr=="search"||S.scr=="details")render()}).catch(()=>{})}
let TMR=null;
function startSim(r){clearInterval(TMR);const c=[0];for(let i=1;i<r.pts.length;i++)c.push(c[i-1]+hav(r.pts[i-1][0],r.pts[i-1][1],r.pts[i][0],r.pts[i][1]));
const L0=c[c.length-1],P=Math.max(120,r.min*120),off=[0,.33,.66],mk=off.map(()=>L.marker(r.pts[0],{icon:L.divIcon({html:'<div style="font-size:26px">🚐</div>',className:"",iconSize:[30,30],iconAnchor:[15,15]})}).addTo(LM));
function pos(p){const d=p*L0;let i=1;while(i<c.length-1&&c[i]<d)i++;const t=(d-c[i-1])/((c[i]-c[i-1])||1);return[r.pts[i-1][0]+(r.pts[i][0]-r.pts[i-1][0])*t,r.pts[i-1][1]+(r.pts[i][1]-r.pts[i-1][1])*t]}
function tick(){const now=Date.now()/1000;let h='<b>🚐 รถตู้ที่กำลังวิ่ง</b> <span class="tag">จำลอง Demo</span>';
off.forEach((o,i)=>{const f=(now/P+o)%1,p=f<.5?f*2:(1-f)*2;mk[i].setLatLng(pos(p));const eta=Math.max(0,Math.round((1-f)*P/60));h+='<div class="row"><span>Demo-'+(i+1)+(f<.5?" → ไปปลายทาง":" ← กลับต้นทาง")+'</span><span>ถึงจุดขึ้นรถ ~'+eta+' นาที</span></div>'});
const v=document.getElementById("vlist");if(v)v.innerHTML=h+'<div class="m">ตำแหน่งรถเป็นการจำลองบนเส้นทางถนนจริง ยังไม่ใช่ GPS ของรถจริง</div>'}
tick();TMR=setInterval(()=>{if(!document.getElementById("lmap")){clearInterval(TMR);return}tick()},1000)}
function initMap(){const el=document.getElementById("lmap");if(!el)return;
if(typeof L==="undefined"){el.innerHTML='<div class="card">โหลดแผนที่ไม่ได้ (ต้องออนไลน์)</div>';return}
LM=L.map(el).setView([14.012,100.67],11);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(LM);
const col={pu:"#16a34a",dr:"#d97706",rmutt:"#1d4ed8",fp:"#1d4ed8"},g=[];
for(const k in PL){const p=PL[k];L.circleMarker([p.la,p.lo],{radius:9,color:"#fff",weight:2,fillColor:col[k],fillOpacity:1}).addTo(LM).bindPopup("<b>"+p.n+"</b><br>"+p.t+"<br>รอบรถ: "+NA);g.push([p.la,p.lo])}
if(S.me){L.circleMarker([S.me.la,S.me.lo],{radius:8,color:"#fff",weight:2,fillColor:"#ef4444",fillOpacity:1}).addTo(LM).bindPopup("คุณอยู่ที่นี่");g.push([S.me.la,S.me.lo])}
LM.fitBounds(g,{padding:[30,30]});
loadRoute(r=>{if(document.getElementById("lmap")===el)L.polyline(r.pts,{color:"#1d4ed8",weight:5}).addTo(LM);startSim(r)})}
function info(){if(!S.sel)return"";const p=PL[S.sel];return `<div class="card"><b>${p.n}</b><div class="m">ประเภท: ${p.t}</div><div class="m">รอบรถ: ${NA} · เวลาโดยประมาณ: ${NA}</div></div>`}
function locate(cb){S.msg="กำลังขอตำแหน่ง...";render();
if(!navigator.geolocation){S.msg="ไม่สามารถเข้าถึงตำแหน่งของคุณได้ คุณสามารถค้นหาเส้นทางด้วยตนเองได้";return render()}
navigator.geolocation.getCurrentPosition(p=>{S.me={la:p.coords.latitude,lo:p.coords.longitude};const m=Math.round(hav(S.me.la,S.me.lo,PL.pu.la,PL.pu.lo));
S.msg=m>20000?"ตำแหน่งของคุณอยู่ไกลจากพื้นที่ Demo มาก (ห่างจุดขึ้นรถ Demo ประมาณ "+(m/1000).toFixed(0)+" กม.)":`คุณอยู่ห่างจากจุดขึ้นรถ (Demo) ประมาณ ${m} เมตร · เดินประมาณ ${Math.max(1,Math.round(m/80))} นาที`;cb&&cb();render()},
()=>{S.msg="ไม่สามารถเข้าถึงตำแหน่งของคุณได้ คุณสามารถค้นหาเส้นทางด้วยตนเองได้";render()},{timeout:8000})}
function toggleFav(){if(!S.user)return;const k=key(),i=S.fav.indexOf(k);i<0?S.fav.push(k):S.fav.splice(i,1);try{localStorage.setItem("vr_fav",JSON.stringify(S.fav))}catch(e){}render()}
function header(t,back){return `${back?`<button class="back" onclick="go('${back}')">← กลับ</button>`:""}<h2>${t}</h2>`}
const V={
splash:()=>`<div class="hero" style="min-height:100vh;padding-top:30vh"><div class="logo">🚐</div><h1>VanRoute RMUTT</h1><p>กำลังโหลด...</p></div>`,
login:()=>`<div class="hero"><div class="logo">🚐</div><h1 style="margin:8px 0">VanRoute RMUTT</h1><p>ค้นหาเส้นทางรถตู้โดยสารระหว่าง RMUTT และฟิวเจอร์พาร์ค รังสิต</p></div><div class="p"><button class="btn" onclick="S.user={name:'ผู้ใช้ตัวอย่าง',email:'demo@example.com'};go('home')">เข้าสู่ระบบด้วย Google (จำลอง)</button><button class="btn o" onclick="S.user=null;go('home')">ใช้งานโดยไม่เข้าสู่ระบบ</button><p class="m">Prototype: การเข้าสู่ระบบเป็นการจำลอง ยังไม่เชื่อม Google จริง ขอเฉพาะชื่อ อีเมล รูปโปรไฟล์</p></div>`,
home:()=>`<div class="p"><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><div style="font-size:34px">${S.user?"🧑‍🎓":"👤"}</div><div><b>สวัสดี${S.user?" "+S.user.name:""}</b><div class="m">${S.user?"เข้าสู่ระบบแล้ว":"Guest"}</div></div></div>
<div class="card"><div class="m">ต้นทาง</div><select class="sel" onchange="S.o=this.value">${opts(S.o)}</select><button class="sw" onclick="[S.o,S.d]=[S.d,S.o];render()">⇅</button><div class="m">ปลายทาง</div><select class="sel" onchange="S.d=this.value">${opts(S.d)}</select><button class="btn" onclick="S.o==S.d?alert('เลือกต้นทางและปลายทางต่างกัน'):go('search')">ค้นหาเส้นทาง</button></div>
<div class="sc"><div onclick="go('map')"><b>🗺️</b>แผนที่</div><div onclick="go('routes')"><b>🚐</b>รถตู้</div><div onclick="go('map');locate()"><b>📍</b>ตำแหน่ง</div><div onclick="go('routes')"><b>🕐</b>รอบรถ</div><div onclick="go('profile')"><b>⭐</b>โปรด</div></div>
${S.user&&S.fav.length?`<h3>เส้นทางโปรด</h3>${S.fav.map(f=>{const[a,b]=f.split(">");return `<div class="card" onclick="S.o='${a}';S.d='${b}';go('search')">⭐ ${PL[a].n} → ${PL[b].n}</div>`}).join("")}`:""}</div>`,
search:()=>`<div class="p">${header("ผลการค้นหา","home")}<div class="card"><b>${lab()}</b><div class="row"><span>เส้นทางที่แนะนำ</span><span>รถตู้โดยสาร (Demo)</span></div><div class="row"><span>ระยะทาง</span><span>${dist()}</span></div><div class="row"><span>เวลาเดินทาง</span><span>${tm()}</span></div><div class="row"><span>จุดขึ้นรถ</span><span>${PL[S.o=="rmutt"?"pu":"dr"].n}</span></div><div class="row"><span>จุดลงรถ</span><span>${PL[S.o=="rmutt"?"dr":"pu"].n}</span></div><div class="row"><span>รอบรถ</span><span>ยังไม่มีข้อมูลรอบรถที่ยืนยัน</span></div><div class="row"><span>ค่าโดยสาร</span><span>${NA}</span></div></div><button class="btn" onclick="go('details')">ดูรายละเอียดเส้นทาง</button></div>`,
details:()=>`<div class="p">${header("รายละเอียดเส้นทาง","search")}<div class="card"><div class="row"><span>🚐 ประเภทรถ</span><span>รถตู้โดยสาร</span></div><div class="row"><span>📍 ต้นทาง</span><span>${PL[S.o].n}</span></div><div class="row"><span>📍 ปลายทาง</span><span>${PL[S.d].n}</span></div><div class="row"><span>📏 ระยะทาง</span><span>${dist()}</span></div><div class="row"><span>🕐 เวลา</span><span>${tm()}</span></div><div class="row"><span>💰 ค่าโดยสาร</span><span>${NA}</span></div></div>
<button class="btn" onclick="go('map');locate()">นำทางไปจุดขึ้นรถ</button><button class="btn o" onclick="S.sel=null;go('map')">ดูเส้นทางทั้งหมด</button><button class="btn o" onclick="go('routes')">ข้อมูลรถตู้ / รอบรถ</button>
${S.user?`<button class="btn o" onclick="toggleFav()">${S.fav.includes(key())?"⭐ นำออกจากรายการโปรด":"☆ บันทึกเป็นเส้นทางโปรด"}</button>`:`<p class="m">เข้าสู่ระบบเพื่อบันทึกเส้นทางโปรด</p>`}</div>`,
map:()=>`<div class="p">${header("แผนที่","")}${map()}<div id="vlist" class="card" style="margin-top:12px"></div><button class="btn" style="margin-top:12px" onclick="locate()">ใช้ตำแหน่งปัจจุบันของฉัน</button>${S.msg?`<div class="card">${S.msg}</div>`:""}${info()}<p class="m">แผนที่จริงจาก OpenStreetMap · เส้นทางคำนวณจากถนนจริง (OSRM) · จุดขึ้น/ลงรถเป็น Demo รอแทนด้วยพิกัดจริง</p></div>`,
routes:()=>`<div class="p">${header("รถตู้ / รอบรถ","")}<div class="card"><b>${lab()}</b><div class="row"><span>ชื่อ/หมายเลขรถ</span><span>ไม่มีข้อมูลในขณะนี้</span></div><div class="row"><span>จุดจอด</span><span>ไม่มีข้อมูลในขณะนี้</span></div><div class="row"><span>ค่าโดยสาร</span><span>${NA}</span></div><div class="row"><span>สถานะ Real-time</span><span class="tag">ยังไม่รองรับ</span></div></div>
<div style="display:flex;gap:6px;margin-bottom:10px">${["วันนี้","พรุ่งนี้","เลือกวัน"].map(x=>`<button class="btn ${S.date==x?"":"o"}" style="margin:0" onclick="S.date='${x}';render()">${x}</button>`).join("")}</div>
${S.date=="เลือกวัน"?`<input type="date" class="sel" style="margin-bottom:10px">`:""}<div class="card"><div class="row"><b>เวลาออก</b><b>เส้นทาง</b><b>สถานะ</b></div><div style="padding:8px 0"><span class="tag">ข้อมูลจำลอง Demo Data – ไม่ใช่รอบรถจริง (${S.date})</span></div>${["06:30","07:15","08:00","09:30","11:00","13:00","15:30","17:00","18:30"].map(t=>`<div class="row"><span>${t}</span><span>${PL[S.o].n.split(" ")[0]} → ${PL[S.d].n.split(" ")[0]}</span><span class="tag ok">Demo</span></div>`).join("")}</div>
<div class="card"><b>🔔 การแจ้งเตือน</b><div class="m">โครงสร้างเตรียมไว้: รอบรถใกล้ถึงเวลา · เปลี่ยนรอบ · เปลี่ยนเส้นทาง · งดให้บริการ (ยังไม่เปิด ต้องมี Backend)</div></div></div>`,
profile:()=>`<div class="p">${header("โปรไฟล์","")}${S.user?`<div class="card"><div style="font-size:40px">🧑‍🎓</div><b>${S.user.name}</b><div class="m">${S.user.email}</div></div><div class="card"><b>⭐ เส้นทางโปรด</b>${S.fav.length?S.fav.map(f=>{const[a,b]=f.split(">");return `<div class="row">${PL[a].n} → ${PL[b].n}</div>`}).join(""):'<div class="m">ยังไม่มี</div>'}</div><button class="btn o" onclick="S.user=null;go('login')">ออกจากระบบ</button>`:`<div class="card"><b>คุณกำลังใช้งานแบบ Guest</b></div><button class="btn" onclick="go('login')">เข้าสู่ระบบด้วย Google</button>`}
<div class="card"><b>⚙️ การตั้งค่า</b><div class="row"><span>ธีม</span><span><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'" style="min-height:40px">สลับสว่าง/มืด</button></span></div></div></div>`};
const tabs=[["home","🏠","Home"],["map","🗺️","Map"],["routes","🚐","Routes"],["profile","👤","Profile"]];
function render(){A.innerHTML=V[S.scr]();const n=$("nav");const show=!["splash","login"].includes(S.scr);n.hidden=!show;if(S.scr=="map")initMap();if(S.scr=="search"||S.scr=="details")loadRoute();
n.style.display=show?"flex":"none";n.innerHTML=tabs.map(([k,i,l])=>`<button class="${k==S.scr?"a":""}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join("")}
render();setTimeout(()=>S.scr=="splash"&&go("login"),1400);
</script></body></html>
